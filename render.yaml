services:
  - type: web
    name: jango-backend
    runtime: python
    plan: 0.5c-1g
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: jango-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jango-postgres
          property: connectionString
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.7-flash,gemini-3.6-flash
      - key: AI_MAX_ATTEMPTS
        value: "2"
      - key: AI_RETRY_BASE_SECONDS
        value: "1"
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: ANTHROPIC_CHAT_MODEL
        value: claude-sonnet-4-5
      - key: CHROMA_PERSIST_DIRECTORY
        value: /var/data/chroma
      - key: DOCUMENT_STORAGE_DIRECTORY
        value: /var/data/documents
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_INPUT_COST_PER_1M_USD
        value: "0"
      - key: AI_OUTPUT_COST_PER_1M_USD
        value: "0"

databases:
  - name: jango-postgres
    databaseName: jango
    user: jango
    plan: 0.1c-256mb
